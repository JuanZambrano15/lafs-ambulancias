[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api/app", "api/tests"]

[tool.ruff.lint]
# E/F: errores y estilo básicos de pyflakes/pycodestyle
# B: flake8-bugbear (bugs comunes) · I: orden de imports · UP: modernizar sintaxis
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "api"
packages = ["app"]
strict = true
# FastAPI/SQLAlchemy a veces necesitan Any en límites de tipado (p.ej. **kwargs
# de dependencias); se relaja explícitamente eso, no todo el chequeo.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api"]
